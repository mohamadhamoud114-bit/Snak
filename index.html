<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة الثعبان النيون</title>
    <link rel="stylesheet" href="style.css">
    <!-- ربط ملف manifest لإمكانية تثبيت اللعبة كتطبيق -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="game-container">
        <!-- شريط النتيجة -->
        <div class="score-board">
            <div class="score-box">
                <span>النقاط:</span>
                <span id="current-score">0</span>
            </div>
            <div class="score-box">
                <span>أعلى نتيجة:</span>
                <span id="high-score">0</span>
            </div>
        </div>

        <!-- لوحة الرسم واللعب -->
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- أزرار التحكم باللمس للموبايل -->
        <div class="touch-controls">
            <button class="control-btn up" onclick="changeDirection('UP')"><i class="fas fa-arrow-up"></i></button>
            <div class="horizontal-btns">
                <button class="control-btn left" onclick="changeDirection('LEFT')"><i class="fas fa-arrow-right"></i></button>
                <button class="control-btn right" onclick="changeDirection('RIGHT')"><i class="fas fa-arrow-left"></i></button>
            </div>
            <button class="control-btn down" onclick="changeDirection('DOWN')"><i class="fas fa-arrow-down"></i></button>
        </div>
    </div>

    <!-- شاشة بداية اللعبة وخسارة المرحلة -->
    <div class="overlay" id="startOverlay">
        <div class="overlay-card">
            <h1><i class="fas fa-gamepad"></i> ثعبان النيون</h1>
            <p>تحدى نفسك واجمع أعلى عدد من النقاط!</p>
            <button class="start-btn" onclick="startGame()">بدء اللعبة الآن</button>
        </div>
    </div>

    <script src="script.js"></script>
    <!-- كود تسجيل الـ Service Worker للتثبيت المباشر -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
</body>
</html>
